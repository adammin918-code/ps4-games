<h2 class="name">Call of Duty: Black Ops II</h2>

<div id="status" class="status"></div>

<script>
const PKG_URL = 'PUT_YOUR_AUTHORIZED_DIRECT_PKG_URL_HERE';

function status(t){
  const e=document.getElementById('status');
  e.textContent=t;
  e.className='status show';
  clearTimeout(window.st);
  window.st=setTimeout(()=>e.className='status',5000);
}

function saveIP(){
  const ip=document.getElementById('ps4ip').value.trim();
  if(!ip) return status('❌ اكتب IP البلايستيشن');
  localStorage.setItem('ps4ip',ip);
  status('✅ تم حفظ IP');
}

function installGame(){
  const ip=document.getElementById('ps4ip').value.trim();
  if(!ip) return status('❌ اكتب IP البلايستيشن أولاً');
  if(PKG_URL.startsWith('PUT_')) return status('⚠️ ضع رابط PKG مباشر ومصرح لك باستخدامه داخل PKG_URL');

  if(!confirm('تثبيت Call of Duty: Black Ops II؟')) return;
  status('⏳ جاري إرسال الطلب إلى الـPS4...');

  fetch('http://' + ip + ':12800/api/install', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({type:'direct',packages:[PKG_URL]})
  })
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); })
  .then(()=>status('✅ تم إرسال طلب التثبيت إلى الـPS4'))
  .catch(()=>status('❌ فشل الاتصال: تأكد من IP وتشغيل خدمة RPI على الـPS4 والمنفذ 12800'));
}

document.getElementById('ps4ip').value=localStorage.getItem('ps4ip')||'';
</script>
