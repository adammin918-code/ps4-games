<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتبة ألعاب PS4 المباشرة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131a;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#171b24;padding:18px;border-bottom:1px solid #2b3240}
h1{text-align:center;margin:0 0 12px;font-size:28px;color:#0070d1}
.header-controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:700px;margin:auto}
#search{flex:1;min-width:200px;padding:12px 16px;border:1px solid #2b3240;border-radius:10px;font-size:16px;background:#10131a;color:#fff;outline:none}
#search:focus{border-color:#0070d1}
#ps4ip{width:140px;padding:12px;border:1px solid #2b3240;border-radius:10px;font-size:15px;background:#10131a;color:#fff;text-align:center;outline:none}
#ps4ip:focus{border-color:#0070d1}
#status{text-align:center;color:#b9c2d0;padding:16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:18px;max-width:1400px;margin:auto}
.card{background:#1a1f29;border:1px solid #2a3240;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;transition:transform 0.2s, border-color 0.2s}
.card:hover{transform:translateY(-3px);border-color:#0070d1}
.cover{width:100%;height:245px;object-fit:cover;background:#252b36;display:block}
.info{padding:12px;display:flex;flex-direction:column;gap:8px;flex-grow:1;justify-content:space-between}
.name{font-weight:bold;font-size:15px;line-height:1.4;min-height:42px;word-break:break-word}
.badge{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;background:#303846;color:#dce3ee;align-self:flex-start}
.btn-group{display:flex;gap:6px;margin-top:10px}
.btn{flex:1;background:#0070d1;color:#fff;border:0;padding:10px 6px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:13px;transition:background 0.2s}
.btn:hover{background:#005bb5}
.btn-update{background:#28a745}
.btn-update:hover{background:#218838}
.empty{grid-column:1/-1;text-align:center;padding:40px;color:#aeb8c7}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0070d1;color:#fff;padding:12px 24px;border-radius:10px;font-weight:bold;display:none;box-shadow:0 4px 14px rgba(0,0,0,0.6);z-index:100}
</style>
</head>
<body>

<header>
  <h1>🎮 مكتبة ألعاب PS4 المباشرة</h1>
  <div class="header-controls">
    <input id="search" type="search" placeholder="🔎 ابحث عن لعبة...">
    <input id="ps4ip" type="text" value="127.0.0.1" title="IP جهاز الـ PS4 (127.0.0.1 إذا كنت تستخدم متصفح الـ PS4 نفسه)">
  </div>
</header>

<div id="status">جاري تحميل مكتبة الألعاب...</div>
<main id="grid"></main>
<div id="toast"></div>

<script>
const grid=document.getElementById('grid'),statusBox=document.getElementById('status'),search=document.getElementById('search'),ipInput=document.getElementById('ps4ip'),toast=document.getElementById('toast');
let games=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function slug(s){return String(s??'').replace(/[™®©]/g,'').replace(/[<>:"/\\|?*]/g,'').replace(/\s+/g,' ').trim()}
function fallback(name){
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><rect width="100%" height="100%" fill="#252b36"/><text x="50%" y="48%" fill="white" font-size="34" text-anchor="middle" font-family="Arial" dominant-baseline="middle">'+esc(String(name??'').slice(0,28))+'</text><text x="50%" y="55%" fill="#9aa5b5" font-size="20" text-anchor="middle" font-family="Arial">PS4</text></svg>';
 return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)
}
function candidates(g){const n=slug(g.name);const e=encodeURIComponent(n);return [g.image||'',`images/${e}.jpg`,`images/${e}.jpeg`,`images/${e}.png`,`images/${n}.jpg`,`images/${n}.png`].filter(Boolean)}
function cover(img,a,i,n){if(i>=a.length){img.src=fallback(n);return}img.onerror=()=>cover(img,a,i+1,n);img.src=a[i]}

// دالة عرض التنبيهات
function showToast(msg){
  toast.textContent=msg;
  toast.style.display='block';
  setTimeout(()=>toast.style.display='none',3500);
}

// دالة إرسال رابط اللعبة إلى PS4 مباشرة
function installGame(url){
  if(!url) return showToast('❌ لا يوجد رابط متاح لهذا الملف');
  const ip = ipInput.value.trim() || '127.0.0.1';
  showToast('⏳ جاري إرسال الطلب للـ PS4...');
  
  fetch(`http://${ip}:12800/api/install`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({type:'direct',packages:[url]})
  })
  .then(r=>{
    if(r.ok) showToast('✅ تم التوجيه بنجاح! افحص التنزيلات بالبلايستيشن');
    else showToast('⚠️ حدثت مشكلة أثناء استجابة الجهاز');
  })
  .catch(e=>showToast('❌ تعذر الاتصال بالـ PS4! تأكد من تشغيل GoldHEN أو RPI'));
}

function render(){
 const q=search.value.trim().toLowerCase(),list=games.filter(g=>String(g.name||'').toLowerCase().includes(q));
 statusBox.textContent=list.length+' لعبة';grid.innerHTML='';
 if(!list.length){grid.innerHTML='<div class="empty">ماكو ألعاب مطابقة للبحث.</div>';return}
 const f=document.createDocumentFragment();
 
 list.forEach(g=>{
  const c=document.createElement('article');c.className='card';
  const i=document.createElement('img');i.className='cover';i.alt=g.name||'PS4';
  cover(i,candidates(g),0,g.name);
  
  const inf=document.createElement('div');inf.className='info';
  const topDiv=document.createElement('div');
  const n=document.createElement('div');n.className='name';n.textContent=g.name||'بدون اسم';
  const b=document.createElement('span');b.className='badge';b.textContent=g.image?'🖼️ غلاف مرتبط':'🖼️ الغلاف من مجلد images';
  topDiv.append(n,b);

  // إنشاء أزرار التثبيت
  const btns=document.createElement('div');btns.className='btn-group';
  
  // زر اللعبة الأساسية
  if(g.url || g.base_url){
    const bBtn=document.createElement('button');
    bBtn.className='btn';
    bBtn.textContent='تثبيت ⬇️';
    bBtn.onclick=()=>installGame(g.url || g.base_url);
    btns.append(bBtn);
  }
  
  // زر التحديث (إن وجد)
  if(g.update_url){
    const uBtn=document.createElement('button');
    uBtn.className='btn btn-update';
    uBtn.textContent='تحديث ⚡';
    uBtn.onclick=()=>installGame(g.update_url);
    btns.append(uBtn);
  }

  inf.append(topDiv,btns);
  c.append(i,inf);
  f.append(c);
 });
 grid.append(f);
}

async function load(){
 try{
  const r=await fetch('games.json?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();if(!Array.isArray(d))throw new Error('games.json ليس Array');
  games=d.filter(g=>g&&typeof g.name==='string'&&g.name.trim());render();
 }catch(e){
  console.error(e);statusBox.innerHTML='❌ ما قدرت أقرأ <b>games.json</b><br><small>خلي index.html و games.json بنفس مجلد Root في GitHub.</small>';
 }
}

search.addEventListener('input',render);
load();
</script>
</body>
</html>
