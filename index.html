<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎮 مكتبة PS4</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.top{position:sticky;top:0;background:#0b0d10ee;backdrop-filter:blur(8px);padding:12px 0;z-index:2}h1{margin:0 0 14px}.bar{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:220px;padding:13px;border-radius:10px;border:1px solid #333;background:#15181d;color:#fff;font-size:16px}.count{color:#aaa;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:#14171c;border:1px solid #292d34;border-radius:14px;padding:0 0 15px;min-height:310px;display:flex;flex-direction:column;gap:10px;overflow:hidden}.cover{width:100%;height:250px;object-fit:cover;background:#0f1115;display:block}.cover.loading{opacity:.55}.card-body{padding:0 15px;display:flex;flex-direction:column;gap:10px;flex:1}.name{font-weight:700;font-size:17px;line-height:1.35}.pkg{font-size:12px;color:#888;word-break:break-all;min-height:18px}.btn{margin-top:auto;padding:11px;border:0;border-radius:9px;background:#2d7dff;color:white;font-weight:700;cursor:pointer}.btn:disabled{background:#30343b;color:#888;cursor:not-allowed}.empty{text-align:center;color:#888;padding:40px}.hint{font-size:13px;color:#aaa;margin-top:8px}</style></head><body><div class="wrap"><div class="top"><h1>🎮 مكتبة PS4</h1><div class="bar"><input id="ip" placeholder="IP الـPS4 مثل 192.168.1.20"><input id="search" placeholder="🔎 ابحث عن لعبة..."></div><div class="hint">RPI: المنفذ 12800 — أضف روابط PKG التي تملك حق استخدامها إلى games.json.</div><div class="count" id="count">جاري التحميل...</div></div><main class="grid" id="grid"></main></div><script>let games=[],imageCache={};const grid=document.getElementById('grid'),search=document.getElementById('search'),ip=document.getElementById('ip');ip.value=localStorage.getItem('ps4ip')||'';ip.addEventListener('input',()=>localStorage.setItem('ps4ip',ip.value.trim()));function fallbackImage(name){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><rect width="100%" height="100%" fill="#11151b"/><text x="50%" y="46%" text-anchor="middle" fill="#aaa" font-size="34" font-family="Arial">${escapeXml(name.slice(0,28))}</text><text x="50%" y="53%" text-anchor="middle" fill="#666" font-size="20" font-family="Arial">PS4</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}function escapeXml(s){return s.replace(/[<>&'"]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[m]))}async function getImage(name){if(imageCache[name]!==undefined)return imageCache[name];imageCache[name]=null;try{const title=encodeURIComponent(name.replace(/[™®]/g,'').trim());const r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${title}`);if(!r.ok)throw Error();const d=await r.json();imageCache[name]=(d.thumbnail&&d.thumbnail.source)?d.thumbnail.source:fallbackImage(name)}catch(e){imageCache[name]=fallbackImage(name)}return imageCache[name]}function render(){const q=search.value.trim().toLowerCase();const list=games.filter(g=>(g.name||'').toLowerCase().includes(q));document.getElementById('count').textContent=`${list.length} لعبة`;grid.innerHTML=list.length?'':'<div class="empty">ماكو ألعاب مطابقة.</div>';list.forEach(g=>{const c=document.createElement('article');c.className='card';const img=document.createElement('img');img.className='cover loading';img.alt=`غلاف ${g.name}`;img.src=g.image||imageCache[g.name]||fallbackImage(g.name);const body=document.createElement('div');body.className='card-body';const n=document.createElement('div');n.className='name';n.textContent=g.name;const p=document.createElement('div');p.className='pkg';p.textContent=g.pkg?'PKG جاهز':'PKG غير مضاف';const b=document.createElement('button');b.className='btn';b.textContent='📡 إرسال للـPS4';b.disabled=!g.pkg;b.onclick=()=>install(g.pkg,g.name);c.append(img,body);body.append(n,p,b);grid.append(c);if(!g.image&&!imageCache[g.name]){getImage(g.name).then(src=>{img.src=src;img.classList.remove('loading')})}else{img.classList.remove('loading')}})}async function install(pkg,name){const addr=ip.value.trim();if(!addr)return alert('دخل IP الـPS4 أولاً');if(!pkg)return alert('ماكو رابط PKG');try{const r=await fetch(`http://${addr}:12800/api/install`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'direct',packages:[pkg]})});if(!r.ok)throw Error(r.status);alert(`تم إرسال ${name} إلى RPI`)}catch(e){alert('تعذر الاتصال بـRPI. تأكد أن الـPS4 والصفحة على نفس الشبكة وأن RPI يعمل.')}}fetch('games.json').then(r=>r.json()).then(d=>{games=Array.isArray(d)?d:[];render()}).catch(()=>{document.getElementById('count').textContent='تعذر تحميل games.json'});search.addEventListener('input',render);</script></body></html>
